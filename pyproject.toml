[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaynak"
version = "0.1.0"
description = "Hybrid retrieval and offline evaluation for Turkish RAG systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seyyid Abdulbaki Bozkurt" }]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
dense = ["sentence-transformers>=2.6"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
